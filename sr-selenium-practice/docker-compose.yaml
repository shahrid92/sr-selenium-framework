version: "3.9"  # Docker Compose version

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword    # ✅ root password
      MYSQL_DATABASE: testdb               # default database
      MYSQL_USER: testuser                 # optional non-root user
      MYSQL_PASSWORD: testpassword         # password for non-root user
    ports:
      - "3306:3306"                        # Expose port to host
    volumes:
      - db_data:/var/lib/mysql             # Persist data

volumes:
  db_data:
